backend:
  name: git-gateway

media_folder: "images"
public_folder: "/images"

collections:
  - name: "news"
    label: "News"
    folder: "_news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
